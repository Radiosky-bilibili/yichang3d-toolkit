<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>长江航线 · 平滑处理预览</title>
<style>
  html,body{margin:0;background:#0b1118;color:#e6eef6;
    font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",Helvetica,Arial,sans-serif}
  #page{width:1400px;padding:14px 16px 18px}
  h2{font-size:15px;font-weight:600;margin:0 0 8px;color:#cfe4f5}
  h2 small{color:#7d93a8;font-weight:400;margin-left:8px}
  canvas{display:block;border:1px solid rgba(255,255,255,.1);border-radius:10px;background:#070c12}
  .row{display:flex;gap:14px}
  .note{color:#8ba3b8;font-size:12px;margin:6px 0 14px}
  .tag{display:inline-block;padding:1px 7px;border-radius:6px;background:rgba(79,195,247,.16);color:#9fdcff;margin-right:6px}
</style>
</head>
<body>
<div id="page">
  <h2>长江 FPV 航线 · 平滑预览 <small id="meta"></small></h2>
  <div class="note"><span class="tag">灰虚线</span>你手绘的 32 个航点　<span class="tag">青实线</span>平滑后的航线（最小曲率半径 420 m）　<span class="tag">橘虚线</span>DEM 谷底校正线（把航线拉回江心，中位只动 1 m、窄段最多 260 m）</div>
  <canvas id="A" width="1400" height="980"></canvas>
  <h2 style="margin-top:16px">沿程高度剖面 <small>（高程来自程序内嵌 DEM；青色为计划飞行高度，已做成地形跟随 + 安全余量 + 开场俯冲）</small></h2>
  <canvas id="C" width="1400" height="360"></canvas>
  <div class="row" style="margin-top:16px">
    <div><h2>放大检查 ① 峡谷急弯 · 28.5 km（每格 3.2 km 宽）</h2><canvas id="B1" width="685" height="380"></canvas></div>
    <div><h2>放大检查 ② 三峡人家弯 · 34.2 km</h2><canvas id="B2" width="685" height="380"></canvas></div>
  </div>
  <div class="row">
    <div><h2>放大检查 ③ 葛洲坝—城区 · 54 km</h2><canvas id="B3" width="685" height="380"></canvas></div>
    <div><h2>放大检查 ④ 下游猇亭段 · 78 km</h2><canvas id="B4" width="685" height="380"></canvas></div>
  </div>
</div>
<script src="preview_data_v4.js"></script>
<script>
const D = window.PDATA, SC = 2;            // 工具底图 px = 主纹理 px / 2
const img = new Image(); img.src = 'sat-tool-3840.jpg';
const dpr = Math.min(window.devicePixelRatio || 1, 2);
function setup(cv){ const w=cv.width, h=cv.height; cv.style.width=w+'px'; cv.style.height=h+'px';
  cv.width=w*dpr; cv.height=h*dpr; const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,w,h); return g; }
const P = D.smooth.map(p => [p[0]/SC, p[1]/SC]);        // 主纹理px → 底图px
const O = D.orig.map(p => [p[0]/SC, p[1]/SC]);
const prof = D.profile;

function fitter(pts, w, h, pad){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  pts.forEach(([x,y])=>{x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);});
  let bw=x1-x0, bh=y1-y0;
  const avail_w=w-2*pad, avail_h=h-2*pad, target=avail_w/avail_h;
  if (bw/bh < target) { const nb=bh*target; x0-=(nb-bw)/2; bw=nb; x1=x0+bw; }
  else { const nb=bw/target; y0-=(nb-bh)/2; bh=nb; y1=y0+bh; }
  const s=Math.min(avail_w/bw, avail_h/bh);
  const ox=(w-bw*s)/2 - x0*s, oy=(h-bh*s)/2 - y0*s;
  return {s, f:([x,y])=>[x*s+ox, y*s+oy], s0:[x0,y0], s1:[x1,y1]};
}
function path(g, pts, F, {color, width, dash=[], glow=0}) {
  g.save(); g.setLineDash(dash); g.lineJoin='round'; g.lineCap='round';
  const draw = (wd, col) => { g.beginPath();
    pts.forEach((p,i)=>{ const [x,y]=F(p); i?g.lineTo(x,y):g.moveTo(x,y); });
    g.lineWidth=wd; g.strokeStyle=col; g.stroke(); };
  if (glow) draw(width+4, glow);
  draw(width, color); g.restore();
}
function dot(g, F, p, r, fill, label, col){
  const [x,y]=F(p); g.beginPath(); g.arc(x,y,r,0,7); g.fillStyle=fill; g.fill();
  g.lineWidth=1.5; g.strokeStyle='rgba(0,0,0,.75)'; g.stroke();
  if(label){ g.font='600 12px -apple-system,"PingFang SC",sans-serif';
    g.lineWidth=3; g.strokeStyle='rgba(0,0,0,.85)'; g.fillStyle=col||'#eaf4ff';
    g.strokeText(label, x+9, y+4); g.fillText(label, x+9, y+4); }
}

/* ---------- A：全线 ---------- */
function drawA(){
  const cv=document.getElementById('A'), g=setup(cv), w=cv.width/dpr, h=cv.height/dpr;
  const F=fitter(P, w, h, 40);
  const [ix,iy]=F.f(F.s0), iw=(F.s1[0]-F.s0[0])*F.s, ih=(F.s1[1]-F.s0[1])*F.s;
  g.drawImage(img, ix, iy, iw, ih);
  g.save(); g.beginPath(); g.rect(ix, iy, iw, ih); g.clip();
  function distPx(px, py){                       // 到底图坐标折线的最近距离（底图px）
    let best = 1e9;
    for(let i=1;i<P.length;i++){
      const a=P[i-1], b=P[i], vx=b[0]-a[0], vy=b[1]-a[1], L2=vx*vx+vy*vy||1;
      let t=((px-a[0])*vx+(py-a[1])*vy)/L2; t=t<0?0:t>1?1:t;
      best = Math.min(best, Math.hypot(px-(a[0]+vx*t), py-(a[1]+vy*t)));
    }
    return best;
  }
  const boxes = [];
  D.landmarks.forEach(L=>{
    const p=[L.x/SC, L.y/SC];
    if (distPx(p[0],p[1]) > 150) return;         // 只保留航线 2.5 km 内的地标
    const [x,y]=F.f(p);
    g.beginPath(); g.arc(x,y,2.6,0,7); g.fillStyle='rgba(255,209,102,.95)'; g.fill();
    g.font='11px -apple-system,"PingFang SC",sans-serif';
    const tw=g.measureText(L.n).width;
    const box=[x+5, y-9, tw+4, 14];
    if(boxes.some(b=>!(box[0]>b[0]+b[2]||box[0]+box[2]<b[0]||box[1]>b[1]+b[3]||box[1]+box[3]<b[1]))) return;
    boxes.push(box);
    g.lineWidth=3; g.strokeStyle='rgba(0,0,0,.85)'; g.fillStyle='#ffe9b0';
    g.strokeText(L.n, x+5, y+3.5); g.fillText(L.n, x+5, y+3.5);
  });
  path(g, O, F.f, {color:'rgba(230,238,246,.55)', width:2, dash:[7,6]});
  path(g, P, F.f, {color:'#4fc3f7', width:3, glow:'rgba(79,195,247,.28)'});
  if (D.snap) path(g, D.snap.map(q=>[q[0]/SC, q[1]/SC]), F.f, {color:'#ffb74d', width:2.2, dash:[4,4]});
  for(let k=0;k<P.length;k+=Math.round(P.length/9)){
    const a=P[Math.max(0,k-2)], b=P[Math.min(P.length-1,k+2)];
    const [x1,y1]=F.f(a), [x2,y2]=F.f(b); const an=Math.atan2(y2-y1,x2-x1);
    g.save(); g.translate(x2,y2); g.rotate(an); g.beginPath();
    g.moveTo(9,0); g.lineTo(-5,6); g.lineTo(-5,-6); g.closePath();
    g.fillStyle='#ffd166'; g.fill(); g.restore();
  }
  dot(g,F.f,P[0],7,'#5be37a','起点 · 三峡大坝上游');
  dot(g,F.f,P[P.length-1],7,'#ff6b6b','终点 · 下游');
  g.restore();
  document.getElementById('meta').textContent =
    '全长 ' + D.total_km + ' km　最小曲率半径 420 m　平滑控制点 ' + (D.ctrl||'') + ' 个（原 32 个）';
}
/* ---------- B：弯道放大对比 ---------- */
function drawZoom(id, centerKm, spanKm){
  const cv=document.getElementById(id), g=setup(cv), w=cv.width/dpr, h=cv.height/dpr;
  const dk=prof.dist_km;
  let c0=0; while(c0<dk.length-1 && dk[c0]<centerKm) c0++;
  let i0=c0, i1=c0;
  while(i0>0 && dk[i0]>centerKm-spanKm) i0--;
  while(i1<dk.length-1 && dk[i1]<centerKm+spanKm) i1++;
  const sub=P.slice(i0,i1+1), subO=O.filter(p=>{
    // 取落在该里程附近的原始点（按最近距离）
    return true; });
  const F=fitter(sub, w, h, 40);
  const [sx,sy]=F.f(F.s0);
  g.drawImage(img, sx, sy, (F.s1[0]-F.s0[0])*F.s, (F.s1[1]-F.s0[1])*F.s);
  g.save(); g.beginPath(); g.rect(sx, sy, (F.s1[0]-F.s0[0])*F.s, (F.s1[1]-F.s0[1])*F.s); g.clip();
  path(g, O, F.f, {color:'rgba(230,238,246,.6)', width:2.5, dash:[7,6]});
  path(g, sub, F.f, {color:'#4fc3f7', width:3.5, glow:'rgba(79,195,247,.3)'});
  if (D.snap) path(g, D.snap.map(q=>[q[0]/SC, q[1]/SC]), F.f, {color:'#ffb74d', width:2.2, dash:[4,4]});
  sub.forEach((p,i)=>{ if(i%6) return; dot(g,F.f,p,2.6,'#ffd166'); });
  g.restore();
  g.font='12px -apple-system,"PingFang SC",sans-serif'; g.fillStyle='#9fdcff';
  g.fillText('彩色小点 = 平滑后每 0.7 km 的位置（可见均匀、无折角）', 12, h-12);
}
/* ---------- C：高度剖面 ---------- */
function drawC(){
  const cv=document.getElementById('C'), g=setup(cv), w=cv.width/dpr, h=cv.height/dpr;
  const L=54, R=18, T=16, B=34;                       // 边距
  const X=d=>L+(d/ D.total_km)*(w-L-R);
  const ymax=Math.ceil(Math.max(...prof.alt)/200)*200+100;
  const Y=e=>h-B-(e/ymax)*(h-T-B);
  g.clearRect(0,0,w,h);
  // 网格
  g.strokeStyle='rgba(255,255,255,.08)'; g.fillStyle='#7d93a8'; g.font='11px sans-serif'; g.lineWidth=1;
  for(let e=0;e<=ymax;e+=200){ const y=Y(e); g.beginPath(); g.moveTo(L,y); g.lineTo(w-R,y); g.stroke();
    g.fillText(e+' m', 8, y+4); }
  for(let d=0;d<=D.total_km;d+=10){ const x=X(d); g.beginPath(); g.moveTo(x,T); g.lineTo(x,h-B); g.stroke();
    g.fillText(d+'', x-6, h-14); }
  g.fillStyle='#9fb6c9'; g.fillText('沿程距离 (km)', w-R-96, h-4);
  // 地形填充
  g.beginPath(); prof.dist_km.forEach((d,i)=> i?g.lineTo(X(d),Y(prof.terrain[i])):g.moveTo(X(d),Y(prof.terrain[i])));
  g.lineTo(X(prof.dist_km[prof.dist_km.length-1]), Y(0)); g.lineTo(X(0), Y(0)); g.closePath();
  g.fillStyle='rgba(90,140,90,.35)'; g.fill();
  // 谷底
  g.beginPath(); prof.dist_km.forEach((d,i)=> i?g.lineTo(X(d),Y(prof.floor[i])):g.moveTo(X(d),Y(prof.floor[i])));
  g.strokeStyle='rgba(120,200,255,.5)'; g.lineWidth=1.2; g.stroke();
  // 地形线
  g.beginPath(); prof.dist_km.forEach((d,i)=> i?g.lineTo(X(d),Y(prof.terrain[i])):g.moveTo(X(d),Y(prof.terrain[i])));
  g.strokeStyle='#9be08a'; g.lineWidth=1.6; g.stroke();
  // 计划高度
  g.beginPath(); prof.dist_km.forEach((d,i)=> i?g.lineTo(X(d),Y(prof.alt[i])):g.moveTo(X(d),Y(prof.alt[i])));
  g.strokeStyle='#4fc3f7'; g.lineWidth=2.4; g.stroke();
  // 地标竖线
  (D.marks||[]).forEach((m,mi)=>{
    const x=X(m.km); g.save(); g.setLineDash([4,4]); g.strokeStyle='rgba(255,209,102,.55)'; g.lineWidth=1;
    g.beginPath(); g.moveTo(x,T); g.lineTo(x,h-B); g.stroke(); g.restore();
    g.save(); g.translate(x+3, T+12 + (mi%3)*14); g.fillStyle='#ffd166'; g.font='11px -apple-system,"PingFang SC",sans-serif';
    g.fillText(m.n+' '+m.km+'km', 0, 0); g.restore();
  });
  // 图例
  const lx=w-R-330, ly=T+14;
  const leg=[[ '#9be08a','沿线地形'],[ 'rgba(120,200,255,.9)','谷底/水面基准'],[ '#4fc3f7','计划飞行高度']];
  leg.forEach(([c,t],i)=>{ const y=ly+i*17; g.fillStyle=c; g.fillRect(lx,y-8,14,3); g.fillStyle='#cfe4f5';
    g.font='11.5px -apple-system,"PingFang SC",sans-serif'; g.fillText(t, lx+20, y-3); });
}
img.onload = () => { drawA(); drawC(); drawZoom('B1', 28.5, 1.6); drawZoom('B2', 34.2, 1.6); drawZoom('B3', 54.0, 1.6); drawZoom('B4', 78.0, 1.6); };
</script>
</body>
</html>
