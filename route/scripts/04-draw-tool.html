<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>长江中心线绘制 · 宜昌 3D 地图</title>
<style>
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#0a0f16;color:#e6eef6;
    font:13px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC",Helvetica,Arial,sans-serif;overscroll-behavior:none}
  #wrap{position:fixed;inset:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .panel{position:absolute;background:rgba(9,14,22,.82);backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.12);border-radius:12px}
  #hud{left:10px;top:10px;padding:9px 12px;max-width:min(78vw,420px)}
  #hud b{color:#4fc3f7;font-weight:600}
  #hud .hint{color:#93a7bd;font-size:11.5px;margin-top:4px}
  #stat{margin-top:5px;font-variant-numeric:tabular-nums}
  #stat span{color:#fff}
  #bar{left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));
    display:flex;gap:6px;padding:7px;align-items:center}
  button{font:inherit;color:#e6eef6;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
    border-radius:9px;padding:8px 12px;min-width:52px;cursor:pointer}
  button:active{background:rgba(79,195,247,.28)}
  button.on{background:rgba(79,195,247,.85);color:#06121c;border-color:transparent;font-weight:600}
  #copy{background:#4fc3f7;color:#06121c;border-color:transparent;font-weight:600}
  #modal{position:absolute;inset:0;background:rgba(4,8,13,.86);display:none;align-items:center;justify-content:center;padding:16px}
  #modal.show{display:flex}
  #modal .box{width:min(680px,94vw);max-height:80vh;display:flex;flex-direction:column;gap:8px;
    background:#0d141d;border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:12px}
  textarea{flex:1;min-height:240px;background:#070c12;color:#cfe4f5;border:1px solid rgba(255,255,255,.14);
    border-radius:10px;padding:9px;font:11.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
    -webkit-user-select:text;user-select:text;white-space:pre;overflow:auto}
  #toast{position:absolute;left:50%;transform:translateX(-50%);bottom:96px;padding:7px 13px;border-radius:20px;
    background:rgba(9,14,22,.9);border:1px solid rgba(255,255,255,.16);opacity:0;transition:opacity .25s;pointer-events:none}
  #toast.show{opacity:1}
  #load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0a0f16;z-index:5}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="hud" class="panel">
    <div><b>长江中心线</b> · 点击落点，从<b>三峡大坝</b>往东依次点</div>
    <div class="hint">拖动空白=平移 · 双指/滚轮=缩放 · 拖动圆点=微调 · 长按圆点=删除</div>
    <div id="stat">航点 <span id="n">0</span> · 全长 <span id="len">0.0</span> km</div>
  </div>
  <div id="bar" class="panel">
    <button id="undo">撤销</button>
    <button id="clear">清空</button>
    <button id="lm" class="on">地标</button>
    <button id="fit">适配</button>
    <button id="send">发送给我</button>
    <button id="copy">复制数据</button>
  </div>
  <div id="toast"></div>
  <div id="modal"><div class="box">
    <div>把下面这段发给我（或者直接关掉，我这边也能读到）：</div>
    <textarea id="out" readonly></textarea>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button id="selall">全选</button><button id="close">关闭</button>
    </div>
  </div></div>
  <div id="load">正在载入影像…</div>
</div>
<script src="landmarks.js"></script>
<script>
/* ===================== 坐标换算（与主程序 META 完全一致） ===================== */
const TEXW = 7680, TEXH = 5632;            // 主纹理像素
const SCALE = 2;                            // 工具底图 px → 主纹理 px
const MPP = 8.2160;                         // 米 / 主纹理像素
const MPP_TOOL = MPP * SCALE;               // 米 / 工具底图像素 (16.432)
const lon0 = 110.91796875, lon1 = 111.5771484375;
const lat0 = 30.486550842588485, lat1 = 30.90222470517144;
const WPX = 256 * Math.pow(2, 13);
const pxFromLon = lon => (lon + 180) / 360 * WPX;
const pxFromLat = lat => { const r = lat * Math.PI / 180;
  return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * WPX; };
const lonFromPx = px => px / WPX * 360 - 180;
const latFromPx = py => { const n = Math.PI - 2 * Math.PI * py / WPX; return Math.atan(Math.sinh(n)) * 180 / Math.PI; };
const X0 = pxFromLon(lon0), X1 = pxFromLon(lon1), Y0 = pxFromLat(lat1), Y1 = pxFromLat(lat0);
const tex2geo = (x, y) => ({ lon: lonFromPx(X0 + x / TEXW * (X1 - X0)), lat: latFromPx(Y0 + y / TEXH * (Y1 - Y0)) });
const tex2world = (x, y) => ({ X: +(x - TEXW / 2) * MPP, Z: +(y - TEXH / 2) * MPP });  // 米，X 东 Z 南

/* ===================== 状态 ===================== */
const KEY = 'yichang_river_path_v1';
let pts = [];                                // 主纹理像素坐标 [x, y]
let showLm = true;
const view = { s: .2, tx: 0, ty: 0 };        // 屏幕 = 底图px * s + t
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const img = new Image();
let ready = false;

try { const raw = localStorage.getItem(KEY); if (raw) pts = JSON.parse(raw) || []; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(pts)); } catch (e) {} };

/* ===================== 视图 ===================== */
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}
function fit() {
  const w = innerWidth, h = innerHeight - 0;
  const s = Math.min(w / (TEXW / SCALE), h / (TEXH / SCALE)) * .92;
  view.s = s;
  view.tx = (w - TEXW / SCALE * s) / 2;
  view.ty = (h - TEXH / SCALE * s) / 2;
  draw();
}
const toImg = (sx, sy) => [(sx - view.tx) / view.s, (sy - view.ty) / view.s];      // 屏幕 → 底图px
const toScr = (ix, iy) => [ix * view.s + view.tx, iy * view.s + view.ty];          // 底图px → 屏幕
const clampView = () => { view.s = Math.max(.03, Math.min(8, view.s)); };

/* ===================== 绘制 ===================== */
function draw() {
  const w = innerWidth, h = innerHeight;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#0a0f16'; ctx.fillRect(0, 0, w, h);
  if (!ready) return;
  // 底图
  ctx.imageSmoothingEnabled = view.s < 1.2;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.save();
  ctx.translate(view.tx, view.ty); ctx.scale(view.s, view.s);
  ctx.drawImage(img, 0, 0, TEXW / SCALE, TEXH / SCALE);
  ctx.restore();
  // 地标
  if (showLm && window.LANDMARKS_PX) {
    ctx.save();
    for (const L of window.LANDMARKS_PX) {
      const [sx, sy] = toScr(L.x / SCALE, L.y / SCALE);
      if (sx < -40 || sy < -20 || sx > w + 40 || sy > h + 20) continue;
      ctx.beginPath(); ctx.arc(sx, sy, 3.2, 0, 7); ctx.fillStyle = '#ffd166'; ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.75)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.font = '11px -apple-system,"PingFang SC",sans-serif';
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.8)'; ctx.fillStyle = '#ffe9b0';
      ctx.strokeText(L.n, sx + 6, sy + 4); ctx.fillText(L.n, sx + 6, sy + 4);
    }
    ctx.restore();
  }
  // 折线
  if (pts.length) {
    ctx.save(); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    const draw = (w2, c) => {
      ctx.beginPath();
      pts.forEach((p, i) => { const [x, y] = toScr(p[0] / SCALE, p[1] / SCALE); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
      ctx.lineWidth = w2; ctx.strokeStyle = c; ctx.stroke();
    };
    draw(6, 'rgba(0,0,0,.55)'); draw(3.2, '#4fc3f7');
    pts.forEach((p, i) => {
      const [x, y] = toScr(p[0] / SCALE, p[1] / SCALE);
      const first = i === 0, last = i === pts.length - 1;
      ctx.beginPath(); ctx.arc(x, y, first || last ? 7 : 5, 0, 7);
      ctx.fillStyle = first ? '#5be37a' : last ? '#ff6b6b' : '#ffffff';
      ctx.fill(); ctx.lineWidth = 1.6; ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.stroke();
      if (first) { ctx.fillStyle = '#08340f'; ctx.font = 'bold 9px sans-serif'; ctx.fillText('S', x - 3, y + 3); }
      if (last) { ctx.fillStyle = '#3d0808'; ctx.font = 'bold 9px sans-serif'; ctx.fillText('E', x - 3, y + 3); }
    });
    ctx.restore();
  }
  // 统计
  document.getElementById('n').textContent = pts.length;
  document.getElementById('len').textContent = (totalKm()).toFixed(1);
}
function totalKm() {
  let m = 0;
  for (let i = 1; i < pts.length; i++) m += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]) * MPP;
  return m / 1000;
}

/* ===================== 交互 ===================== */
const pointers = new Map();
let mode = null, dragIdx = -1, startScr = null, startView = null, moved = 0, downTime = 0,
    pinchStart = null, longTimer = null, longFired = false;

function hit(sx, sy) {                        // 命中已有点？
  for (let i = 0; i < pts.length; i++) {
    const [x, y] = toScr(pts[i][0] / SCALE, pts[i][1] / SCALE);
    if (Math.hypot(x - sx, y - sy) < 16) return i;
  }
  return -1;
}
function insertAt(sx, sy) {                   // 插到最近线段上（顺序感更自然）
  const [ix, iy] = toImg(sx, sy);
  const p = [ix * SCALE, iy * SCALE];
  if (pts.length < 2) { pts.push(p); return; }
  let bi = pts.length, bd = Infinity;
  const seg = (a, b, q) => {                  // 点到线段距离（主纹理px）
    const vx = b[0] - a[0], vy = b[1] - a[1], wx = q[0] - a[0], wy = q[1] - a[1];
    const t = Math.max(0, Math.min(1, (vx * wx + vy * wy) / (vx * vx + vy * vy || 1)));
    return Math.hypot(wx - vx * t, wy - vy * t);
  };
  for (let i = 1; i < pts.length; i++) { const d = seg(pts[i - 1], pts[i], p); if (d < bd) { bd = d; bi = i; } }
  pts.splice(bi, 0, p);
}
function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 1400);
}

cv.addEventListener('pointerdown', e => {
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if (pointers.size === 2) {                  // 开始双指缩放
    const [a, b] = [...pointers.values()];
    pinchStart = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), s: view.s,
                   cx: (a[0] + b[0]) / 2, cy: (a[1] + b[1]) / 2,
                   tx: view.tx, ty: view.ty };
    mode = 'pinch'; return;
  }
  downTime = Date.now(); moved = 0; longFired = false;
  startScr = [e.clientX, e.clientY]; startView = [view.tx, view.ty];
  const i = hit(e.clientX, e.clientY);
  if (i >= 0) {
    mode = 'point'; dragIdx = i;
    longTimer = setTimeout(() => {            // 长按删除
      longFired = true; pts.splice(i, 1); save(); draw(); toast('已删除该点'); vibrate();
    }, 550);
  } else { mode = 'pan'; }
});
cv.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if (mode === 'pinch' && pointers.size >= 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    const k = d / (pinchStart.d || 1);
    view.s = pinchStart.s * k; clampView();
    const cx = (a[0] + b[0]) / 2, cy = (a[1] + b[1]) / 2;
    view.tx = cx - (pinchStart.cx - pinchStart.tx) * k * (view.s / pinchStart.s) * (pinchStart.s / view.s);
    view.tx = cx - (pinchStart.cx - pinchStart.tx) * k;
    view.ty = cy - (pinchStart.cy - pinchStart.ty) * k;
    draw(); return;
  }
  moved = Math.max(moved, Math.hypot(e.clientX - startScr[0], e.clientY - startScr[1]));
  if (moved > 8) { clearTimeout(longTimer); }
  if (mode === 'point' && !longFired) {
    const [ix, iy] = toImg(e.clientX, e.clientY);
    pts[dragIdx] = [ix * SCALE, iy * SCALE]; save(); draw();
  } else if (mode === 'pan') {
    view.tx = startView[0] + (e.clientX - startScr[0]);
    view.ty = startView[1] + (e.clientY - startScr[1]);
    draw();
  }
});
function endPointer(e) {
  clearTimeout(longTimer);
  pointers.delete(e.pointerId);
  if (mode === 'pan' && moved < 8 && Date.now() - downTime < 500 && !longFired) {
    insertAt(e.clientX, e.clientY); save(); draw(); vibrate();
  }
  if (pointers.size === 0) mode = null;
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const k = Math.exp(-e.deltaY * 0.0016);
  const [ix, iy] = toImg(e.clientX, e.clientY);
  view.s = Math.max(.03, Math.min(8, view.s * k));
  view.tx = e.clientX - ix * view.s; view.ty = e.clientY - iy * view.s;
  draw();
}, { passive: false });
function vibrate() { try { navigator.vibrate && navigator.vibrate(12); } catch (e) {} }

/* ===================== 按钮 ===================== */
document.getElementById('undo').onclick = () => { pts.pop(); save(); draw(); };
document.getElementById('clear').onclick = () => {
  if (!pts.length) return;
  if (confirm('清空全部 ' + pts.length + ' 个航点？')) { pts = []; save(); draw(); }
};
document.getElementById('lm').onclick = e => { showLm = !showLm; e.target.classList.toggle('on', showLm); draw(); };
document.getElementById('fit').onclick = fit;
document.getElementById('close').onclick = () => document.getElementById('modal').classList.remove('show');
document.getElementById('selall').onclick = () => { const t = document.getElementById('out'); t.focus(); t.select(); };
function payload() {
  return JSON.stringify({
    v: 1, frame: 'tex7680x5632', mpp: MPP,
    pts: pts.map(p => [Math.round(p[0] * 10) / 10, Math.round(p[1] * 10) / 10]),
    geo: pts.map(p => { const g = tex2geo(p[0], p[1]); return [+g.lon.toFixed(6), +g.lat.toFixed(6)]; }),
    world: pts.map(p => { const w = tex2world(p[0], p[1]); return [Math.round(w.X), Math.round(w.Z)]; })
  });
}
document.getElementById('copy').onclick = async () => {
  const s = payload();
  document.getElementById('out').value = s;
  document.getElementById('modal').classList.add('show');
  try { await navigator.clipboard.writeText(s); toast('已复制到剪贴板'); }
  catch (e) { toast('请手动全选复制'); }
};
document.getElementById('send').onclick = async () => {
  const s = payload();
  document.getElementById('out').value = s;
  if (!pts.length) { toast('还没有航点'); return; }
  try {
    await fetch('http://127.0.0.1:8765/__snap?name=river_path.json',
                { method: 'POST', mode: 'no-cors', body: s });
    toast('已发送（如果我没收到，就用「复制数据」发我）');
  } catch (e) {
    document.getElementById('modal').classList.add('show');
    toast('发送失败，请把文本框里的内容发我');
  }
};

/* ===================== 启动 ===================== */
img.onload = () => { ready = true; document.getElementById('load').style.display = 'none'; resize(); fit(); };
img.onerror = () => { document.getElementById('load').textContent = '底图载入失败'; };
img.src = 'sat-tool-3840.jpg';
addEventListener('resize', resize);
</script>
</body>
</html>
